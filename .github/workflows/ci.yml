name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signing-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: fmt
        working-directory: signing-service
        run: cargo fmt --check
      - name: Cache kata-tools
        id: kata-cache
        uses: actions/cache@v4
        with:
          path: /opt/kata
          key: kata-tools-${{ hashFiles('signing-service/Dockerfile') }}
      - name: Install pinned genpolicy (policy size-class test)
        if: steps.kata-cache.outputs.cache-hit != 'true'
        working-directory: signing-service
        run: |
          set -eux
          KATA_TOOLS_VERSION=$(sed -n 's/^ARG KATA_TOOLS_VERSION=//p' Dockerfile | head -1)
          KATA_TOOLS_SHA256=$(sed -n 's/^ARG KATA_TOOLS_SHA256=//p' Dockerfile | head -1)
          curl -fsSL -o /tmp/kata-tools.tar.zst \
            "https://github.com/kata-containers/kata-containers/releases/download/${KATA_TOOLS_VERSION}/kata-tools-static-${KATA_TOOLS_VERSION}-amd64.tar.zst"
          echo "${KATA_TOOLS_SHA256}  /tmp/kata-tools.tar.zst" | sha256sum -c -
          mkdir -p /opt/kata
          tar --zstd -xf /tmp/kata-tools.tar.zst -C /opt/kata \
            ./opt/kata/bin/genpolicy \
            ./opt/kata/share/defaults/kata-containers/rules.rego \
            ./opt/kata/share/defaults/kata-containers/genpolicy-settings.json \
            ./opt/kata/share/defaults/kata-containers/genpolicy-settings.d
      - name: test
        working-directory: signing-service
        env:
          GENPOLICY_BIN: /opt/kata/opt/kata/bin/genpolicy
          GENPOLICY_RULES_PATH: /opt/kata/opt/kata/share/defaults/kata-containers/rules.rego
          GENPOLICY_SETTINGS_DIR: /opt/kata/opt/kata/share/defaults/kata-containers
        run: cargo test --locked
      - name: clippy
        working-directory: signing-service
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/enclava-labs/policy-signing-service
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
      - name: Select build profile
        id: build_profile
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "profile=release" >> "$GITHUB_OUTPUT"
          else
            echo "profile=debug" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and maybe push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: signing-service/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_PROFILE=${{ steps.build_profile.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - name: Sign pushed digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/enclava-labs/policy-signing-service
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3; do
            if cosign sign --yes "${IMAGE}@${DIGEST}"; then
              exit 0
            fi
            sleep "$((attempt * 10))"
          done
          exit 1
